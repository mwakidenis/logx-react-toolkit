version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      "react-ecosystem":
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      "logx":
        patterns:
          - "@mwakidenis/logx"
